<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Tutor Chat</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body data-page="chat">
  <div class="page">
    <div class="chat-card" id="chat-card">
      <div class="chat-header">
        <div>
          <h1>Finance Tutor</h1>
          <p class="subtitle">Educational guidance only — not professional financial advice.</p>
        </div>
        <button id="logout-btn" class="secondary">Logout</button>
      </div>
      <div class="chat-settings">
        <div class="field">
          <label for="knowledge-level">Your level</label>
          <select id="knowledge-level">
            <option selected>Beginner</option>
            <option>Intermediate</option>
            <option>Advanced</option>
          </select>
        </div>
        <div class="field">
          <label for="topic">Topic</label>
          <select id="topic">
            <option selected>General</option>
            <option>Budgeting</option>
            <option>Investing basics</option>
            <option>UK taxes</option>
            <option>Retirement</option>
            <option>Risk management</option>
            <option>Debt management</option>
            <option>Business finance</option>
          </select>
        </div>
      </div>
      <div class="chat-window" id="chat-window" aria-live="polite">
        <div class="message bot">
          <div class="bubble">
            Hi! Pick your level and a topic above, then ask me anything about money. I'll explain it simply and give you something practical to try.
          </div>
        </div>
      </div>
      <form id="chat-form" class="chat-input">
        <label for="chat-message" class="visually-hidden">Your message</label>
        <input type="text" id="chat-message" placeholder="Ask a finance question" maxlength="2000" autocomplete="off" required />
        <button type="submit" id="send-btn">Send</button>
      </form>
      <p class="note">This conversation lives only in this tab. Nothing is stored on the server.</p>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
