<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Tutor</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body data-page="auth">
  <div class="page single-column">
    <div class="auth-card">
      <h1>Finance Tutor</h1>
      <p class="subtitle">Securely sign in or create a free account to start chatting.</p>
      <p id="auth-error" class="error hidden" role="alert"></p>
      <form id="login-form">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" autocomplete="email" required />
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required />
        <button type="submit">Login</button>
      </form>
      <form id="register-form">
        <h2>New here?</h2>
        <label for="register-email">Email</label>
        <input type="email" id="register-email" autocomplete="email" required />
        <label for="register-password">Password (8 characters or more)</label>
        <input type="password" id="register-password" autocomplete="new-password" minlength="8" required />
        <button type="submit">Create account</button>
      </form>
      <p class="note">Passwords are securely hashed. Never share them.</p>
      <p class="note">Chat messages are not stored for privacy.</p>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
