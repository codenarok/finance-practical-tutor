<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Tutor</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body data-page="auth">
  <div class="page single-column">
    <div class="auth-card">
      <h1>Finance Tutor</h1>
      <p class="subtitle">Securely sign in or create a free account to start chatting.</p>
      <form id="login-form">
        <label>Email</label>
        <input type="email" id="login-email" required />
        <label>Password</label>
        <input type="password" id="login-password" required />
        <button type="submit">Login</button>
      </form>
      <form id="register-form">
        <h2>New here?</h2>
        <label>Email</label>
        <input type="email" id="register-email" required />
        <label>Password</label>
        <input type="password" id="register-password" required />
        <button type="submit">Create account</button>
      </form>
      <p class="note">Passwords are securely hashed. Never share them.</p>
      <p class="note">Chat messages are not stored for privacy.</p>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
