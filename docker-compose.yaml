version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: finuser
      POSTGRES_PASSWORD: finpass
      POSTGRES_DB: fintutor
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://finuser:finpass@db:5432/fintutor
      SECRET_KEY: super-secret-key-change-me
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3
    depends_on:
      - db
      - ollama
    ports:
      - "8000:8000"

volumes:
  db_data:
  ollama_data:
