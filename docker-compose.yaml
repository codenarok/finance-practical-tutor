services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: finuser
      POSTGRES_PASSWORD: finpass
      POSTGRES_DB: fintutor
    volumes:
      - db_data:/var/lib/postgresql/data
    # Reachable from this machine only, for `uvicorn` runs outside Docker.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finuser -d fintutor"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Downloads the model once (several GB on first run), then exits.
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3}"]
    depends_on:
      - ollama
    restart: on-failure

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://finuser:finpass@db:5432/fintutor
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
    depends_on:
      db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  db_data:
  ollama_data:
